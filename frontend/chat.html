<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Chat</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <!-- Name Modal -->
  <div class="modal" id="nameModal">
    <div class="modal-content">
      <h2>👋 Welcome</h2>
      <p>Enter your name to join the chat</p>
      <input type="text" class="input" id="nameInput" placeholder="Your name" maxlength="20" autofocus>
      <button class="btn" onclick="joinChat()">Join Chat</button>
    </div>
  </div>

  <!-- Chat UI -->
  <div class="chat-container hidden" id="chatContainer">
    <div class="chat-header">
      <h1>💬 Chat Room</h1>
      <span class="room-badge" id="roomBadge">Room: ---</span>
      <div class="status">
        <span class="connection-status disconnected" id="connectionStatus">
          Connecting...
          <span id="connectionMethod"></span>
        </span>
      </div>
    </div>

    <div class="messages" id="messageList"></div>

    <div class="chat-input">
      <input type="text" id="messageInput" placeholder="Type a message..." maxlength="500">
      <button onclick="sendMessage()" id="sendBtn">
        <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z"/>
        </svg>
      </button>
    </div>
  </div>

  <script src="/js/fallback.js"></script>
  <script src="/js/chat.js"></script>
</body>
</html>
